name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag or ref to publish (defaults to main)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # `release_created` is commonly set for single-package mode.
      # In manifest mode, prefer `paths_released` / `releases_created`.
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    # In manifest mode we publish when the `package/` path was released.
    # workflow_dispatch allows manually re-running a publish that failed.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || needs.release-please.outputs.release_created == 'true'
        || (
          needs.release-please.outputs.paths_released != ''
          && contains(fromJSON(needs.release-please.outputs.paths_released), 'package')
        )
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # npm 12+ (needed for OIDC trusted publishing) requires Node >=22.22.2
          node-version: '22'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          # Corepack is enabled after this step; the built-in yarn cache would
          # resolve against the runner's preinstalled yarn 1.x instead.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test

      - name: Type check
        run: yarn typecheck

      - name: Build package
        run: yarn build

      - name: Ensure npm supports OIDC
        run: |
          # npm 11.5.1+ required for trusted publishing (OIDC)
          npm install -g npm@latest
          npm --version

      - name: Publish to NPM
        working-directory: package
        run: npm publish --access public
